<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Alankaboot Sport</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  *{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;-webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale}
  :root{
    --bg:#0a0a0f;
    --card:rgba(255,255,255,0.04);
    --card-2:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.08);
    --border-hi:rgba(255,255,255,0.14);
    --accent:#e11d2e;
    --accent-2:#ff3b52;
    --accent-glow:rgba(225,29,46,.45);
    --purple:#8b5cf6;
    --blue:#3b82f6;
    --cyan:#06b6d4;
    --orange:#f59e0b;
    --green:#22c55e;
    --green-glow:rgba(34,197,94,.4);
    --text:#ffffff;
    --text-dim:#8a8a9a;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{overflow-x:hidden;width:100%;position:relative;height:100%}
  body{background:#0a0a0f;color:var(--text);min-height:100vh;position:relative;
    overscroll-behavior:none;-webkit-overflow-scrolling:touch}

  /* ================= الخلفية المتحركة (بره) ================= */
  .bg-layer{position:fixed;inset:0;z-index:-4;background:#05050a}
  .bg-mesh{position:fixed;inset:0;z-index:-3;pointer-events:none;
    background:
      radial-gradient(ellipse 900px 600px at 12% 8%, rgba(225,29,46,.40), transparent 55%),
      radial-gradient(ellipse 800px 500px at 88% 15%, rgba(139,92,246,.35), transparent 55%),
      radial-gradient(ellipse 1000px 700px at 50% 95%, rgba(59,130,246,.30), transparent 60%),
      radial-gradient(ellipse 700px 500px at 5% 75%, rgba(6,182,212,.22), transparent 60%),
      radial-gradient(ellipse 750px 500px at 95% 65%, rgba(245,158,11,.22), transparent 60%),
      radial-gradient(ellipse 600px 500px at 50% 50%, rgba(225,29,46,.12), transparent 65%);
    background-size:200% 200%,200% 200%,200% 200%,200% 200%,200% 200%,200% 200%;
    animation:meshMove 25s ease-in-out infinite;filter:saturate(1.15)}
  @keyframes meshMove{
    0%,100%{background-position:0% 0%,100% 0%,50% 100%,0% 50%,100% 50%,50% 50%}
    25%{background-position:50% 25%,50% 50%,0% 50%,100% 25%,0% 75%,25% 25%}
    50%{background-position:100% 50%,0% 100%,50% 0%,50% 100%,50% 0%,75% 75%}
    75%{background-position:50% 75%,100% 50%,100% 50%,0% 75%,100% 25%,25% 50%}
  }
  .bg-noise{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
  .bg-grid{position:fixed;inset:0;z-index:-2;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at 50% 20%,black 15%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 20%,black 15%,transparent 70%)}
  .bg-orbs{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
  .bg-orbs .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.65}
  .orb1{width:380px;height:380px;top:-120px;left:-100px;
    background:radial-gradient(circle,rgba(225,29,46,.85) 0%,transparent 70%);
    animation:orb1 18s ease-in-out infinite}
  .orb2{width:420px;height:420px;bottom:-150px;right:-150px;
    background:radial-gradient(circle,rgba(139,92,246,.75) 0%,transparent 70%);
    animation:orb2 22s ease-in-out infinite}
  .orb3{width:300px;height:300px;top:35%;right:-100px;
    background:radial-gradient(circle,rgba(59,130,246,.65) 0%,transparent 70%);
    animation:orb3 20s ease-in-out infinite}
  .orb4{width:260px;height:260px;bottom:15%;left:-100px;
    background:radial-gradient(circle,rgba(6,182,212,.55) 0%,transparent 70%);
    animation:orb4 24s ease-in-out infinite}
  @keyframes orb1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,60px) scale(1.2)}}
  @keyframes orb2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-50px) scale(1.15)}}
  @keyframes orb3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,50px) scale(1.1)}}
  @keyframes orb4{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-50px) scale(1.12)}}

  .bg-lines{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;opacity:.35}
  .bg-lines span{position:absolute;width:2px;height:140px;animation:lineFall linear infinite;filter:blur(.5px)}
  @keyframes lineFall{
    0%{transform:translateY(-200px);opacity:0}
    10%{opacity:1}
    90%{opacity:1}
    100%{transform:translateY(110vh);opacity:0}
  }

  /* ================= جوه البث: الخلفية تنور وتطفي ببطء ================= */
  body.stream-open .bg-mesh{
    animation:bgPulseSoft 5s ease-in-out infinite !important;
  }
  @keyframes bgPulseSoft{
    0%,100%{opacity:.45;filter:saturate(.9) brightness(.85)}
    50%{opacity:.95;filter:saturate(1.2) brightness(1.2)}
  }
  body.stream-open .bg-orbs .orb{
    animation:orbPulseSoft 6s ease-in-out infinite !important;
  }
  @keyframes orbPulseSoft{
    0%,100%{opacity:.35;transform:scale(1)}
    50%{opacity:.75;transform:scale(1.12)}
  }
  body.stream-open .bg-lines span{
    display:none;
  }
  body.stream-open .bg-noise{
    opacity:.02;
  }

  /* ================= Splash ================= */
  #splash{position:fixed;inset:0;background:#05050a;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    z-index:9999;transition:opacity .8s;overflow:hidden;padding:20px}
  #splash.hide{opacity:0;pointer-events:none}
  .splash-bg{position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 25% 15%, rgba(225,29,46,.45), transparent 55%),
      radial-gradient(ellipse at 75% 85%, rgba(139,92,246,.40), transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(59,130,246,.25), transparent 65%);
    animation:splashBgPulse 6s ease-in-out infinite alternate}
  @keyframes splashBgPulse{0%{transform:scale(1);filter:hue-rotate(0deg) brightness(1)}100%{transform:scale(1.25);filter:hue-rotate(25deg) brightness(1.15)}}
  .splash-shape{position:absolute;border-radius:50%;filter:blur(50px);opacity:.8;pointer-events:none}
  .shape1{width:300px;height:300px;top:-100px;left:-100px;background:radial-gradient(circle,#e11d2e,transparent 70%);animation:float1 12s ease-in-out infinite}
  .shape2{width:260px;height:260px;bottom:-80px;right:-80px;background:radial-gradient(circle,#8b5cf6,transparent 70%);animation:float2 14s ease-in-out infinite}
  .shape3{width:200px;height:200px;top:45%;right:-60px;background:radial-gradient(circle,#3b82f6,transparent 70%);animation:float3 10s ease-in-out infinite}
  .shape4{width:180px;height:180px;bottom:20%;left:-60px;background:radial-gradient(circle,#f59e0b,transparent 70%);animation:float4 13s ease-in-out infinite}
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,50px) scale(1.2)}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,-50px) scale(1.15)}}
  @keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,40px) scale(1.1)}}
  @keyframes float4{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.12)}}
  .splash-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .splash-particles span{position:absolute;width:3px;height:3px;border-radius:50%;animation:particleFloat linear infinite}
  @keyframes particleFloat{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100px) scale(1);opacity:0}}
  .splash-rings{position:relative;width:200px;height:200px;display:flex;justify-content:center;align-items:center;margin-bottom:30px;z-index:2}
  .splash-ring{position:absolute;border-radius:50%;border:2.5px solid transparent}
  .ring1{inset:0;border-top-color:#e11d2e;border-right-color:#e11d2e;animation:spinRing 2.2s linear infinite;filter:drop-shadow(0 0 10px rgba(225,29,46,.9))}
  .ring2{inset:16px;border-bottom-color:#8b5cf6;border-left-color:#8b5cf6;animation:spinRing 2.8s linear infinite reverse;filter:drop-shadow(0 0 10px rgba(139,92,246,.9))}
  .ring3{inset:32px;border-top-color:#3b82f6;border-left-color:#3b82f6;animation:spinRing 1.9s linear infinite;filter:drop-shadow(0 0 10px rgba(59,130,246,.9))}
  @keyframes spinRing{to{transform:rotate(360deg)}}
  .splash-logo{width:96px;height:96px;border-radius:50%;object-fit:contain;padding:12px;background:rgba(10,10,15,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(225,29,46,.55),inset 0 0 20px rgba(255,255,255,.12);animation:logoPulse 3s ease-in-out infinite;position:relative;z-index:3}
  @keyframes logoPulse{0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(225,29,46,.55),inset 0 0 20px rgba(255,255,255,.12)}50%{transform:scale(1.07);box-shadow:0 0 65px rgba(225,29,46,.85),inset 0 0 20px rgba(255,255,255,.25)}}
  .splash-brand{color:#fff;font-size:30px;font-weight:900;letter-spacing:-.5px;margin-bottom:8px;text-align:center;z-index:2;position:relative;background:linear-gradient(90deg,#fff 0%,#ff6b7a 25%,#fff 50%,#a78bfa 75%,#fff 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s ease-in-out infinite}
  @keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .splash-tagline{color:rgba(255,255,255,.7);font-size:13px;font-weight:600;margin-bottom:38px;letter-spacing:.4px;z-index:2;position:relative;display:flex;align-items:center;gap:8px;animation:fadeInUp .8s ease .3s both}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .splash-tagline .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 10px var(--accent-glow);animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.35}}
  .splash-progress-wrap{width:240px;max-width:78%;z-index:2;position:relative;text-align:center}
  .splash-progress{width:100%;height:5px;background:rgba(255,255,255,.08);border-radius:100px;overflow:hidden;position:relative;box-shadow:inset 0 0 12px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.05)}
  .splash-progress-fill{height:100%;width:0;background:linear-gradient(90deg,#e11d2e,#ff3b52,#8b5cf6,#3b82f6,#e11d2e);background-size:400% 100%;border-radius:100px;animation:fillProgress 2.6s cubic-bezier(.4,0,.2,1) forwards,flowGradient 2.5s linear infinite;box-shadow:0 0 14px rgba(225,29,46,.85)}
  @keyframes fillProgress{to{width:100%}}
  @keyframes flowGradient{0%{background-position:0% 50%}100%{background-position:400% 50%}}
  .splash-percent{color:#fff;font-size:13px;font-weight:800;margin-top:14px;letter-spacing:2px;text-shadow:0 0 14px rgba(225,29,46,.7);font-variant-numeric:tabular-nums}

  /* ================= APP Layout ================= */
  #app{display:none;opacity:0;transition:opacity .7s;min-height:100vh;
    padding-top:calc(var(--safe-top) + 12px);
    padding-bottom:calc(96px + var(--safe-bottom));
    position:relative;z-index:1}
  #app.show{display:block;opacity:1}

  .app-topbar{position:sticky;top:0;z-index:50;
    padding:6px 14px 12px;margin:0 -12px 14px;
    background:linear-gradient(180deg,rgba(10,10,15,.85),rgba(10,10,15,.55) 70%,transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .app-topbar-inner{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
  .app-logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.06);padding:4px;border:1px solid var(--border);object-fit:contain;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .app-title-wrap{flex:1;min-width:0;text-align:right}
  .app-title{color:#fff;font-size:14px;font-weight:800;letter-spacing:-.2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app-subtitle{color:var(--text-dim);font-size:10.5px;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:5px}
  .app-subtitle .live-ind{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px var(--accent-glow);animation:blink 1.2s infinite}
  .app-topbar-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,#3aa8e0,#0088cc);display:flex;justify-content:center;align-items:center;flex-shrink:0;text-decoration:none;box-shadow:0 6px 16px rgba(0,136,204,.35),inset 0 1px 0 rgba(255,255,255,.2);transition:.25s}
  .app-topbar-btn:active{transform:scale(.92)}
  .app-topbar-btn svg{width:20px;height:20px;fill:#fff}

  .app-content{max-width:640px;margin:0 auto;padding:0 12px}

  .section-title{display:flex;align-items:center;gap:10px;color:#fff;font-size:15px;font-weight:800;letter-spacing:-.1px;margin:6px 4px 14px}
  .section-title::before{content:'';width:3px;height:16px;border-radius:4px;background:linear-gradient(180deg,var(--accent-2),var(--accent));box-shadow:0 0 12px var(--accent-glow)}
  .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(225,29,46,.35),transparent)}

  /* ============ الأقسام - تصميم رفيع ============ */
  .cats-grid{display:flex;flex-direction:column;gap:8px}
  .cat-tile{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--border);border-radius:14px;
    padding:9px 12px;cursor:pointer;transition:.25s;
    display:flex;align-items:center;gap:12px;
    position:relative;overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.30);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .cat-tile::before{content:'';position:absolute;right:0;top:6px;bottom:6px;width:3px;
    background:linear-gradient(180deg,var(--accent-2),var(--purple));
    border-radius:4px;box-shadow:0 0 10px var(--accent-glow)}
  .cat-tile:active{transform:scale(.98);border-color:rgba(225,29,46,.5);
    background:linear-gradient(90deg,rgba(225,29,46,.12),rgba(225,29,46,.03))}
  .cat-tile .cat-logo{width:44px;height:44px;border-radius:11px;
    background:rgba(255,255,255,.05);padding:5px;
    object-fit:contain;flex-shrink:0;border:1px solid var(--border);
    position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
  .cat-tile .cat-info{flex:1;min-width:0;text-align:right;position:relative;z-index:1}
  .cat-tile .cat-name{color:#fff;font-weight:800;font-size:13.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:2px;letter-spacing:-.1px;line-height:1.2}
  .cat-tile .cat-count{color:var(--accent-2);font-size:10.5px;font-weight:700;
    display:inline-flex;align-items:center;gap:4px;letter-spacing:.1px;opacity:.95}
  .cat-tile .cat-arrow{width:22px;height:22px;border-radius:50%;
    background:rgba(255,255,255,.06);display:flex;justify-content:center;align-items:center;
    flex-shrink:0;position:relative;z-index:1;border:1px solid var(--border)}
  .cat-tile .cat-arrow svg{width:12px;height:12px;fill:var(--text-dim)}

  /* ============ القنوات ============ */
  .channels-grid{display:flex;flex-direction:column;gap:8px}
  .channel-tile{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--border);border-radius:14px;
    padding:9px 12px;cursor:pointer;transition:.25s;
    display:flex;align-items:center;gap:12px;
    position:relative;overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.30);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .channel-tile::before{content:'';position:absolute;right:0;top:6px;bottom:6px;width:3px;
    background:linear-gradient(180deg,var(--green),#4ade80);
    border-radius:4px;box-shadow:0 0 10px var(--green-glow)}
  .channel-tile:not(.live)::before{background:rgba(255,255,255,.15);box-shadow:none}
  .channel-tile:not(.live){opacity:.6}
  .channel-tile:active{transform:scale(.98);border-color:rgba(225,29,46,.5)}
  .channel-tile .logo{width:42px;height:42px;border-radius:10px;
    background:rgba(255,255,255,.05);padding:5px;
    object-fit:contain;flex-shrink:0;border:1px solid var(--border);
    position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
  .channel-tile .name{color:#fff;font-weight:800;font-size:13px;
    flex:1;min-width:0;text-align:right;position:relative;z-index:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    letter-spacing:-.1px}
  .channel-tile .status{display:inline-flex;align-items:center;gap:4px;
    padding:4px 11px;border-radius:100px;font-size:10px;font-weight:800;
    position:relative;z-index:1;flex-shrink:0}
  .channel-tile.live .status{background:linear-gradient(180deg,#4ade80,#16a34a);
    color:#fff;box-shadow:0 4px 12px var(--green-glow)}
  .channel-tile.live .status::before{content:'';width:5px;height:5px;border-radius:50%;
    background:#fff;animation:blink 1.2s infinite}
  .channel-tile:not(.live) .status{background:rgba(255,255,255,.06);
    color:var(--text-dim);border:1px solid var(--border)}

  /* ============ تاب مباشر ============ */
  .live-list{display:flex;flex-direction:column;gap:8px}
  .live-card{position:relative;display:flex;align-items:center;gap:12px;
    background:linear-gradient(90deg,rgba(225,29,46,.10),rgba(139,92,246,.06) 40%,rgba(255,255,255,.02));
    border:1px solid rgba(225,29,46,.20);
    border-radius:14px;padding:9px 12px;cursor:pointer;
    overflow:hidden;transition:.25s;
    box-shadow:0 6px 18px rgba(0,0,0,.30);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .live-card::before{content:'';position:absolute;right:0;top:6px;bottom:6px;width:3px;
    background:linear-gradient(180deg,var(--accent-2),var(--purple));
    border-radius:4px;box-shadow:0 0 10px var(--accent-glow)}
  .live-card:active{transform:scale(.98);border-color:rgba(225,29,46,.55)}
  .live-card .lc-logo{width:44px;height:44px;border-radius:11px;
    background:rgba(255,255,255,.05);padding:5px;object-fit:contain;flex-shrink:0;
    border:1px solid var(--border);position:relative;z-index:1;
    box-shadow:0 4px 10px rgba(0,0,0,.35)}
  .live-card .lc-info{flex:1;min-width:0;text-align:right;position:relative;z-index:1}
  .live-card .lc-name{color:#fff;font-weight:800;font-size:13px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:2px;letter-spacing:-.1px}
  .live-card .lc-cat{color:var(--text-dim);font-size:10px;font-weight:600;
    display:flex;align-items:center;gap:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live-card .lc-cat svg{width:10px;height:10px;fill:var(--accent-2);flex-shrink:0;opacity:.8}
  .live-card .lc-badge{display:flex;align-items:center;gap:4px;
    padding:4px 10px;border-radius:100px;font-size:10px;font-weight:800;
    flex-shrink:0;position:relative;z-index:1}
  .live-card.on .lc-badge{background:linear-gradient(180deg,#4ade80,#16a34a);
    color:#fff;box-shadow:0 4px 10px var(--green-glow)}
  .live-card.on .lc-badge::before{content:'';width:5px;height:5px;border-radius:50%;
    background:#fff;animation:blink 1.2s infinite}
  .live-card.off .lc-badge{background:rgba(255,255,255,.05);color:var(--text-dim);
    border:1px solid var(--border)}
  .live-card.off{opacity:.55}
  .live-card.off::before{background:rgba(255,255,255,.15);box-shadow:none}

  .live-header{display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;margin:0 0 12px;
    background:linear-gradient(135deg,rgba(225,29,46,.18),rgba(139,92,246,.12));

  const bottomNav = $('bottomNav');
  const streamLoader = $('streamLoader');
  const modeBtn = $('modeBtn'), modeText = $('modeText'), modeIcon = $('modeIcon');

  let hls = null, currentChannelId = null, categoriesData = [];
  let currentCatIndex = -1, isStreamViewOpen = false;

  /* ⭐ حالة وضع الكمبيوتر — افتراضياً مقفول (وضع الهاتف) */
  let isDesktopMode = false;

  const ICON_DESKTOP = 'M21 2H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H3V4h18v12z';
  const ICON_PHONE   = 'M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z';

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  (function initBgLines(){
    const wrap = document.getElementById('bgLines');
    if(!wrap) return;
    for(let i=0;i<8;i++){
      const s = document.createElement('span');
      s.style.left = (Math.random()*100) + '%';
      s.style.animationDuration = (6 + Math.random()*6) + 's';
      s.style.animationDelay = (Math.random()*6) + 's';
      s.style.opacity = (0.15 + Math.random()*0.35).toFixed(2);
      const c = Math.random();
      let c1, c2;
      if(c < 0.4){ c1='rgba(225,29,46,.7)'; c2='rgba(255,59,82,.7)'; }
      else if(c < 0.7){ c1='rgba(139,92,246,.7)'; c2='rgba(167,139,250,.7)'; }
      else { c1='rgba(59,130,246,.7)'; c2='rgba(6,182,212,.7)'; }
      s.style.background = `linear-gradient(180deg,transparent,${c1},${c2},transparent)`;
      wrap.appendChild(s);
    }
  })();

  (function initSplash(){
    const container = document.getElementById('splashParticles');
    if(container){
      for(let i=0;i<20;i++){
        const s = document.createElement('span');
        s.style.left = Math.random()*100 + '%';
        s.style.animationDuration = (3 + Math.random()*4) + 's';
        s.style.animationDelay = (Math.random()*3) + 's';
        const size = 2 + Math.random()*3;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        const colors = ['rgba(225,29,46,.9)','rgba(139,92,246,.9)','rgba(59,130,246,.9)','rgba(255,255,255,.9)','rgba(255,107,122,.9)'];
        s.style.background = colors[Math.floor(Math.random()*colors.length)];
        s.style.boxShadow = '0 0 8px ' + s.style.background;
        container.appendChild(s);
      }
    }
    const pctEl = document.getElementById('splashPercent');
    let pct = 0;
    const interval = setInterval(()=>{
      pct = Math.min(100, pct + Math.floor(Math.random()*6) + 2);
      if(pctEl) pctEl.textContent = pct + '%';
      if(pct >= 100) clearInterval(interval);
    }, 90);
  })();

  setTimeout(()=>{
    splash.classList.add('hide');
    setTimeout(()=>{
      splash.style.display = 'none';
      app.classList.add('show');
      bottomNav.style.display = 'flex';
    }, 700);
  }, 2800);

  const client = mqtt.connect(BROKER, { clientId: MY_ID });
  client.on('connect', ()=>{
    client.subscribe(TOPIC_CMD);
    client.subscribe(TOPIC_DATA);
    client.publish(TOPIC_HB, JSON.stringify({id:MY_ID}));
    setInterval(()=> client.publish(TOPIC_HB, JSON.stringify({id:MY_ID})), 5000);
  });

  client.on('message', (topic, msg)=>{
    try{
      const data = JSON.parse(msg.toString());
      if(topic === TOPIC_DATA){
        categoriesData = Array.isArray(data) ? data : [];
        renderCurrentView();
      }
      if(topic === TOPIC_CMD){
        if(data.action === 'stopAll'){ if(isStreamViewOpen) closeStreamUI(); return; }
        if(data.action === 'play' && data.token){
          if (!client.options.reconnectPeriod || Date.now() - (data.ts || 0) < 60000) {
            currentChannelId = data.channelId;
            if(!isStreamViewOpen) {
              streamView.classList.add('show');
              document.body.style.overflow = 'hidden';
              document.body.classList.add('stream-open');
              isStreamViewOpen = true;
              history.pushState({stream: true}, '');
              autoRotateAndFS();
            }
            playStream(tokenToUrl(data.token));
          }
        } else if(data.action === 'stop'){
          if(currentChannelId === data.channelId) closeStreamUI();
        }
      }
    }catch(e){}
  });

  function renderCurrentView(){
    if(currentCatIndex === -1) renderCategories();
    else renderChannels(currentCatIndex);
  }

  function renderCategories(){
    if(!categoriesData.length){
      catsGrid.innerHTML = '<div class="empty-msg">📺<br>لا توجد أقسام متاحة حالياً<br>تابع قناتنا على تيليجرام ليصلك كل جديد</div>';
      return;
    }
    catsGrid.innerHTML = categoriesData.map((cat,i)=>{
      const count = (cat.channels || []).length;
      const liveCountVal = (cat.channels || []).filter(c => c.live).length;
      const countText = liveCountVal > 0 ? `${liveCountVal} بث حي` : `${count} قناة`;
      return `
        <div class="cat-tile" onclick="openCategory(${i})">
          <img class="cat-logo" src="${cat.logo||''}"
               onerror="this.style.opacity=.15"
               alt="${escapeAttr(cat.name||'')}">
          <div class="cat-info">
            <div class="cat-name">${escapeHtml(cat.name||'قسم')}</div>
            <div class="cat-count">${countText}</div>
          </div>
          <div class="cat-arrow">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderChannels(ci){
    const cat = categoriesData[ci];
    if(!cat){ backToCategories(); return; }
    catTitle.textContent = cat.name || 'قنوات القسم';
    const list = cat.channels || [];
    if(!list.length){
      channelsGrid.innerHTML = '<div class="empty-msg">لا توجد قنوات في هذا القسم حالياً</div>';
      return;
    }
    channelsGrid.innerHTML = list.map((ch,chi)=>`
      <div class="channel-tile ${ch.live?'live':''}" onclick="openChannel(${chi})">
        <img class="logo" src="${ch.logo||''}"
             onerror="this.style.opacity=.15"
             alt="${escapeAttr(ch.name||'')}">
        <div class="name">${escapeHtml(ch.name||'قناة')}</div>
        <span class="status">${ch.live?'مباشر':'غير متاح'}</span>
      </div>
    `).join('');
  }

  function renderLiveView(){
    const allChannels = [];
    categoriesData.forEach((cat, ci) => {
      (cat.channels || []).forEach((ch, chi) => {
        allChannels.push({ch, catName: cat.name, ci, chi});
      });
    });
    allChannels.sort((a,b) => (b.ch.live?1:0) - (a.ch.live?1:0));
    liveCount.textContent = allChannels.length;
    if(!allChannels.length){
      liveList.innerHTML = '<div class="empty-msg">📺<br>لا توجد قنوات متاحة حالياً<br>تابع قناتنا على تيليجرام ليصلك كل جديد</div>';
      return;
    }
    liveList.innerHTML = allChannels.map(item => `
      <div class="live-card ${item.ch.live?'on':'off'}" onclick="openLiveChannel(${item.ci},${item.chi})">
        <img class="lc-logo" src="${item.ch.logo||''}"
             onerror="this.style.opacity=.15"
             alt="${escapeAttr(item.ch.name||'')}">
        <div class="lc-info">
          <div class="lc-name">${escapeHtml(item.ch.name||'قناة')}</div>
          <div class="lc-cat">
            <svg viewBox="0 0 24 24"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-1.29 1.41L10.59 6H3c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 13H3V8h18v11zM9 10v6l5-3-5-3z"/></svg>
            ${escapeHtml(item.catName||'قسم')}
          </div>
        </div>
        <span class="lc-badge">${item.ch.live?'مباشر':'غير متاح'}</span>
      </div>
    `).join('');
  }

  function openLiveChannel(ci, chi){
    const cat = categoriesData[ci];
    if(!cat) return;
    playChannelObject(cat.channels[chi]);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[ch]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function openCategory(i){
    currentCatIndex = i;
    viewCategories.style.display = 'none';
    viewChannels.style.display = 'block';
    viewLive.style.display = 'none';
    renderChannels(i);
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function backToCategories(){
    currentCatIndex = -1;
    viewCategories.style.display = 'block';
    viewChannels.style.display = 'none';
    viewLive.style.display = 'none';
    renderCategories();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function openChannel(chi){
    const cat = categoriesData[currentCatIndex];
    if(!cat) return;
    playChannelObject(cat.channels[chi]);
  }

  function playChannelObject(ch){
    if(!ch) return;
    if(!ch.live){ showToast('القناة غير متاحة حالياً'); return; }
    if(!ch.token){ showToast('لا يوجد توكن للبث'); return; }

    currentChannelId = ch.id;
    isStreamViewOpen = true;

    streamView.classList.add('show');
    document.body.style.overflow = 'hidden';
    document.body.classList.add('stream-open');
    playStream(tokenToUrl(ch.token));

    history.pushState({stream: true}, '');
    autoRotateAndFS();
  }

  /* ================== وضع الشاشة ================== */
  function autoRotateAndFS(){
    /* ⭐ لو وضع الكمبيوتر مفعّل: شاشة كاملة أفقية عادية بدون دوران */
    if(isDesktopMode){
      playerBox.classList.add('desktop-mode');
      playerBox.classList.remove('rotate-css');
      enterFullscreen();
      return;
    }
    /* وضع الهاتف (الافتراضي) زي ما كان */
    playerBox.classList.add('rotate-css');
    enterFullscreen();
    setTimeout(()=>{
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(()=>{});
        } else if (screen.lockOrientation) {
          screen.lockOrientation('landscape');
        } else if (screen.mozLockOrientation) {
          screen.mozLockOrientation('landscape');
        } else if (screen.msLockOrientation) {
          screen.msLockOrientation('landscape');
        }
      } catch(e){}
    }, 200);
  }

  function enterFullscreen(){
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      if (playerBox.requestFullscreen) playerBox.requestFullscreen().catch(()=>{});
      else if (playerBox.webkitRequestFullscreen) playerBox.webkitRequestFullscreen();
    } catch(e){}
  }

  function exitFsSafe(){
    playerBox.classList.remove('rotate-css');
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch(e){}
    try {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      else if (screen.unlockOrientation) screen.unlockOrientation();
    } catch(e){}
  }

  /* ⭐⭐⭐ دالة زر وضع الكمبيوتر ⭐⭐⭐ */
  function toggleDesktopMode(){
    isDesktopMode = !isDesktopMode;

    if(isDesktopMode){
      /* تفعيل وضع الكمبيوتر */
      playerBox.classList.add('desktop-mode');
      playerBox.classList.remove('rotate-css');   /* نشيل الدوران */
      modeBtn.classList.add('active');
      modeText.textContent = 'وضع الهاتف';
      modeIcon.innerHTML = '<path d="'+ICON_PHONE+'"/>';

      try {
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      } catch(e){}

      enterFullscreen();
      resetHideTimer();
      showToast('تم تفعيل وضع الشاشات 🖥️');
    } else {
      /* إلغاء وضع الكمبيوتر */
      playerBox.classList.remove('desktop-mode');
      modeBtn.classList.remove('active');
      modeText.textContent = 'وضع للشاشات';
      modeIcon.innerHTML = '<path d="'+ICON_DESKTOP+'"/>';

      showToast('تم إلغاء الوضع');

      /* نرجّع وضع الهاتف: دوران + قفل الشاشة أفقي */
      if(isStreamViewOpen){
        playerBox.classList.add('rotate-css');
        try {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(()=>{});
          } else if (screen.lockOrientation) {
            screen.lockOrientation('landscape');
          } else if (screen.mozLockOrientation) {
            screen.mozLockOrientation('landscape');
          } else if (screen.msLockOrientation) {
            screen.msLockOrientation('landscape');
          }
        } catch(e){}
        enterFullscreen();
      }
      resetHideTimer();
    }
  }

  /* لو المستخدم خرج من الفول سكرين بزر ESC وهو في وضع الكمبيوتر */
  function onFsChange(){
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if(!fsEl && isStreamViewOpen && isDesktopMode){
      /* نسيبه في وضع الكمبيوتر لكن الفيديو لسه بيملأ الشاشة بالـ CSS */
    }
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  window.addEventListener('popstate', function() {
    if (isStreamViewOpen) closeStreamUI();
  });

  function closeStream(){
    if (isStreamViewOpen) {
      isStreamViewOpen = false;
      closeStreamUI();
      if (history.state && history.state.stream) history.back();
    }
  }

  function closeStreamUI(){
    isStreamViewOpen = false;
    currentChannelId = null;
    streamView.classList.remove('show');
    document.body.style.overflow = '';
    document.body.classList.remove('stream-open');
    stopStream();
    exitFsSafe();
  }

  function playStream(url){
    if(!url){ stopStream(); return; }
    showLoader();

    if(hls){ hls.stopLoad(); hls.detachMedia(); hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();
    setTimeout(() => {
      if(Hls.isSupported()){
        hls = new Hls({lowLatencyMode:true,enableWorker:true,maxBufferLength:30,maxMaxBufferLength:60,liveSyncDurationCount:3,liveMaxLatencyDurationCount:10,manifestLoadingTimeOut:15000,manifestLoadingMaxRetry:5,fragLoadingTimeOut:20000,fragLoadingMaxRetry:6});
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, ()=> video.play().catch(()=>{}));
        hls.on(Hls.Events.ERROR, (e,d)=>{
          if(d.fatal){
            if(d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if(d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          }
        });
      } else if(video.canPlayType('application/vnd.apple.mpegurl')){
        video.src = url; video.play().catch(()=>{});
      }
    }, 100);
  }

  let loaderTimeout = null;
  function showLoader(){
    streamLoader.classList.remove('hidden');
    if(loaderTimeout) clearTimeout(loaderTimeout);
    loaderTimeout = setTimeout(()=>{ hideLoader(); }, 20000);
  }
  function hideLoader(){
    streamLoader.classList.add('hidden');
    if(loaderTimeout){ clearTimeout(loaderTimeout); loaderTimeout = null; }
  }

  video.addEventListener('playing', ()=>{ hideLoader(); });
  video.addEventListener('play', ()=>{ hideLoader(); });
  video.addEventListener('waiting', ()=>{ showLoader(); });
  video.addEventListener('stalled', ()=>{ showLoader(); });

  function stopStream(){
    if(hls){ hls.stopLoad(); hls.detachMedia(); hls.destroy(); hls = null; }
    video.pause(); video.removeAttribute('src'); video.load();
    hideLoader();
    placeholder.style.display = 'none';
  }

  function togglePlay(){ video.paused ? video.play().catch(()=>{}) : video.pause(); }
  video.addEventListener('play', ()=>{ playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'; });
  video.addEventListener('pause', ()=>{ playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; });

  function toggleMute(){
    video.muted = !video.muted;
    volIcon.innerHTML = video.muted
      ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
      : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }

  video.addEventListener('timeupdate', ()=>{
    if(video.duration && isFinite(video.duration) && video.duration > 0){
      progressFill.style.width = ((video.currentTime/video.duration)*100) + '%';
      timeDisplay.innerHTML = fmt(video.currentTime)+' / '+fmt(video.duration);
    } else {
      progressFill.style.width = '100%';
      timeDisplay.innerHTML = '<span class="live-dot"></span>';
    }
  });

  function fmt(s){
    if(!s || isNaN(s) || !isFinite(s)) return '0:00';
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return h > 0 ? h+':'+m.toString().padStart(2,'0')+':'+sec : m+':'+sec;
  }

  const progressWrap = document.getElementById('progressWrap');
  let isDraggingSeek = false;
  function seekVideo(e) {
    if (!video.duration || !isFinite(video.duration)) return;
    const rect = progressWrap.getBoundingClientRect();
    let percent = (e.clientX - rect.left) / rect.width;
    percent = Math.max(0, Math.min(1, percent));
    video.currentTime = percent * video.duration;
    progressFill.style.width = (percent * 100) + '%';
  }
  progressWrap.addEventListener('pointerdown', (e) => {
    isDraggingSeek = true;
    try { progressWrap.setPointerCapture(e.pointerId); } catch(err){}
    seekVideo(e); e.preventDefault();
  });
  progressWrap.addEventListener('pointermove', (e) => {
    if (isDraggingSeek) { seekVideo(e); e.preventDefault(); }
  });
  progressWrap.addEventListener('pointerup', (e) => {
    isDraggingSeek = false;
    try { progressWrap.releasePointerCapture(e.pointerId); } catch(err){}
  });
  progressWrap.addEventListener('pointercancel', () => { isDraggingSeek = false; });

  let controlsVisible = true;
  let hideTimer = null;

  function showControls(){
    customControls.classList.remove('hidden');
    controlsVisible = true;
    resetHideTimer();
  }
  function hideControls(){
    customControls.classList.add('hidden');
    controlsVisible = false;
    if(hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
  }
  function resetHideTimer(){
    if(hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>{ hideControls(); }, 3500);
  }
  resetHideTimer();

  playerBox.addEventListener('click', (e) => {
    if (customControls.contains(e.target)) { resetHideTimer(); return; }
    if (e.target.closest('.back-btn')) return;
    if (e.target.closest('.mode-btn')) return;   /* ⭐ ما يتلغبطش مع زر الوضع */
    if (isDraggingSeek) return;
    if (controlsVisible) hideControls();
    else showControls();
  });

  playerBox.addEventListener('touchstart', (e) => {
    if (customControls.contains(e.target)) { resetHideTimer(); return; }
    if (e.target.closest('.back-btn')) return;
    if (e.target.closest('.mode-btn')) return;   /* ⭐ ما يتلغبطش مع زر الوضع */
    if (isDraggingSeek) return;
    if (controlsVisible) hideControls();
    else showControls();
  }, {passive:true});

  function navHome(){
    currentCatIndex = -1;
    viewCategories.style.display = 'block';
    viewChannels.style.display = 'none';
    viewLive.style.display = 'none';
    renderCategories();
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.querySelectorAll('.nav-item')[0].classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function navLive(){
    currentCatIndex = -1;
    viewCategories.style.display = 'none';
    viewChannels.style.display = 'none';
    viewLive.style.display = 'block';
    renderLiveView();
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.querySelectorAll('.nav-item')[1].classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }
</script>
</body>
</html>
