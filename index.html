<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Alankaboot Sport</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  *{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
    touch-action:manipulation;-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed}
  :root{
    --bg:#0a0a0f;--card:rgba(255,255,255,0.04);--card-2:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.08);--border-hi:rgba(255,255,255,0.14);
    --accent:#e11d2e;--accent-2:#ff3b52;--accent-glow:rgba(225,29,46,.45);
    --purple:#8b5cf6;--blue:#3b82f6;--cyan:#06b6d4;--orange:#f59e0b;
    --green:#22c55e;--green-glow:rgba(34,197,94,.4);
    --text:#ffffff;--text-dim:#8a8a9a;
    --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{overflow-x:hidden;width:100%;position:relative;height:100%}
  body{background:#0a0a0f;color:var(--text);min-height:100vh;position:relative;
    overscroll-behavior:none;-webkit-overflow-scrolling:touch}
  .bg-layer{position:fixed;inset:0;z-index:-4;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(225,29,46,.28), transparent 55%),
      radial-gradient(ellipse at 85% 20%, rgba(139,92,246,.22), transparent 55%),
      radial-gradient(ellipse at 50% 90%, rgba(59,130,246,.20), transparent 60%),
      #05050a}
  .bg-grid{position:fixed;inset:0;z-index:-3;pointer-events:none;opacity:.4;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at 50% 20%,black 15%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 20%,black 15%,transparent 70%)}
  .bg-orbs{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden;opacity:.55}
  .bg-orbs .orb{position:absolute;border-radius:50%;filter:blur(60px);
    will-change:transform;transform:translate3d(0,0,0)}
  .orb1{width:300px;height:300px;top:-100px;left:-80px;
    background:radial-gradient(circle,rgba(225,29,46,.7) 0%,transparent 70%);
    animation:orbFloat1 22s ease-in-out infinite}
  .orb2{width:320px;height:320px;bottom:-120px;right:-100px;
    background:radial-gradient(circle,rgba(139,92,246,.6) 0%,transparent 70%);
    animation:orbFloat2 26s ease-in-out infinite}
  @keyframes orbFloat1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(60px,50px,0)}}
  @keyframes orbFloat2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-60px,-45px,0)}}
  #lockScreen{position:fixed;inset:0;z-index:9999;display:flex;
    justify-content:center;align-items:center;padding:22px;
    background:
      radial-gradient(ellipse at 25% 15%, rgba(225,29,46,.30), transparent 55%),
      radial-gradient(ellipse at 75% 85%, rgba(139,92,246,.25), transparent 55%),
      #05050a;
    overflow:hidden;transition:opacity .5s ease}
  #lockScreen.hide{opacity:0;pointer-events:none}
  .lock-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;
    pointer-events:none;will-change:transform;transform:translate3d(0,0,0)}
  .lo1{width:280px;height:280px;top:-100px;left:-80px;
    background:radial-gradient(circle,#e11d2e,transparent 70%);animation:lo1 18s ease-in-out infinite}
  .lo2{width:300px;height:300px;bottom:-120px;right:-100px;
    background:radial-gradient(circle,#8b5cf6,transparent 70%);animation:lo2 20s ease-in-out infinite}
  @keyframes lo1{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(55px,40px,0)}}
  @keyframes lo2{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-50px,-35px,0)}}
  .lock-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lock-stars span{position:absolute;width:2.5px;height:2.5px;border-radius:50%;
    box-shadow:0 0 6px currentColor;will-change:transform,opacity;
    animation:starMove linear infinite}
  @keyframes starMove{
    0%{transform:translate3d(0,110vh,0);opacity:0}
    10%{opacity:1}
    90%{opacity:1}
    100%{transform:translate3d(0,-80px,0);opacity:0}}
  .lock-card{position:relative;z-index:2;width:100%;max-width:380px;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
    border:1px solid rgba(255,255,255,.10);
    border-radius:28px;padding:36px 24px 26px;
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    box-shadow:0 25px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);
    text-align:center;animation:lockCardIn .7s cubic-bezier(.22,1,.36,1) both}
  @keyframes lockCardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .lock-rings{position:relative;width:110px;height:110px;margin:0 auto 18px;
    display:flex;justify-content:center;align-items:center}
  .lock-ring{position:absolute;border-radius:50%;border:2px solid transparent}
  .lr1{inset:0;border-top-color:#ff3b52;border-right-color:#ff3b52;
    animation:spinRing 2.4s linear infinite}
  .lr2{inset:12px;border-bottom-color:#8b5cf6;border-left-color:#8b5cf6;
    animation:spinRing 3s linear infinite reverse}
  @keyframes spinRing{to{transform:rotate(360deg)}}
  .lock-logo{width:64px;height:64px;border-radius:50%;object-fit:contain;padding:8px;
    background:rgba(10,10,15,.9);position:relative;z-index:2;
    box-shadow:0 0 25px rgba(225,29,46,.5),inset 0 0 15px rgba(255,255,255,.12)}
  .lock-title{font-size:24px;font-weight:900;letter-spacing:-.5px;
    margin-bottom:6px;line-height:1.1;
    background:linear-gradient(90deg,#fff 0%,#ff6b7a 30%,#fff 55%,#a78bfa 80%,#fff 100%);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shimmer 6s ease-in-out infinite}
  @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .lock-sub{color:rgba(255,255,255,.65);font-size:12.5px;font-weight:600;
    margin-bottom:26px;display:flex;align-items:center;justify-content:center;gap:6px}
  .lock-sub .lock-dot{width:7px;height:7px;border-radius:50%;
    background:var(--accent-2);box-shadow:0 0 10px var(--accent-glow);
    animation:blink 1.4s infinite}
  .lock-sub.online .lock-dot{background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.7)}
  .lock-sub.offline .lock-dot{background:#f59e0b;box-shadow:0 0 10px rgba(245,158,11,.7)}
  @keyframes blink{50%{opacity:.35}}
  .lock-input-wrap{position:relative;margin-bottom:14px}
  .lock-input{width:100%;background:rgba(0,0,0,.45);
    border:1.5px solid rgba(255,255,255,.10);
    color:#fff;padding:16px 18px;border-radius:16px;
    font-size:19px;font-weight:800;letter-spacing:3px;
    text-align:center;font-family:ui-monospace,Menlo,'Cairo',sans-serif;
    direction:ltr;transition:border-color .25s, background .25s;outline:none}
  .lock-input::placeholder{color:rgba(255,255,255,.22);letter-spacing:3px;font-weight:700}
  .lock-input:focus{border-color:var(--accent-2);background:rgba(225,29,46,.06)}
  .lock-input.err{border-color:#ef4444;animation:shake .5s}
  .lock-input.ok{border-color:#22c55e}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .lock-btn{width:100%;padding:15px;border-radius:16px;border:none;
    background:linear-gradient(180deg,#ff3b52,#e11d2e);color:#fff;
    font-size:14.5px;font-weight:800;font-family:'Cairo',sans-serif;
    cursor:pointer;letter-spacing:.3px;
    box-shadow:0 8px 20px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .lock-btn:active{transform:scale(.97)}
  .lock-btn:disabled{opacity:.6;cursor:not-allowed}
  .lock-btn.loading{background:linear-gradient(180deg,#8a1f28,#6b0a15)}
  .lock-btn svg{width:17px;height:17px;fill:#fff}
  .lock-btn .spinner-mini{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spinRing .8s linear infinite}
  .lock-msg{margin-top:14px;font-size:12.5px;font-weight:700;min-height:20px;line-height:1.5}
  .lock-msg.err{color:#f87171}
  .lock-msg.ok{color:#4ade80}
  .lock-msg.info{color:#93b8f5}
  .lock-footer{margin-top:22px;padding-top:18px;
    border-top:1px solid rgba(255,255,255,.06);
    display:flex;justify-content:center}
  .lock-link{display:inline-flex;align-items:center;gap:6px;
    color:rgba(255,255,255,.6);text-decoration:none;
    font-size:12px;font-weight:700;padding:8px 14px;border-radius:100px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
    transition:transform .15s}
  .lock-link:active{transform:scale(.95)}
  .lock-link svg{width:14px;height:14px;fill:currentColor}
  .lock-security{margin-top:14px;display:flex;align-items:center;justify-content:center;
    gap:6px;color:rgba(255,255,255,.35);font-size:10.5px;font-weight:600}
  .lock-security svg{width:12px;height:12px;fill:currentColor;opacity:.7}
  #app{display:none;opacity:0;transition:opacity .5s;min-height:100vh;
    padding-top:calc(var(--safe-top) + 12px);
    padding-bottom:calc(96px + var(--safe-bottom));position:relative;z-index:1}
  #app.show{display:block;opacity:1}
  .app-topbar{position:sticky;top:0;z-index:50;
    padding:6px 14px 12px;margin:0 -12px 14px;
    background:linear-gradient(180deg,rgba(10,10,15,.9),rgba(10,10,15,.7) 70%,transparent);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .app-topbar-inner{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
  .app-logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.06);
    padding:4px;border:1px solid var(--border);object-fit:contain;flex-shrink:0}
  .app-title-wrap{flex:1;min-width:0;text-align:right}
  .app-title{color:#fff;font-size:14px;font-weight:800;letter-spacing:-.2px;
    line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app-subtitle{color:var(--text-dim);font-size:10.5px;font-weight:600;margin-top:2px;
    display:flex;align-items:center;gap:5px}
  .app-subtitle .live-ind{width:6px;height:6px;border-radius:50%;
    background:var(--accent-2);box-shadow:0 0 8px var(--accent-glow);
    animation:blink 1.2s infinite}
  .app-topbar-btn{width:38px;height:38px;border-radius:50%;
    background:linear-gradient(180deg,#3aa8e0,#0088cc);
    display:flex;justify-content:center;align-items:center;flex-shrink:0;
    text-decoration:none;transition:transform .15s}
  .app-topbar-btn:active{transform:scale(.92)}
  .app-topbar-btn svg{width:20px;height:20px;fill:#fff}
  .session-chip{display:flex;align-items:center;gap:5px;
    padding:6px 11px;border-radius:100px;
    background:linear-gradient(135deg,rgba(34,197,94,.20),rgba(34,197,94,.06));
    border:1px solid rgba(34,197,94,.32);color:#4ade80;
    font-size:11px;font-weight:800;letter-spacing:.2px;
    font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
  .session-chip svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
  .session-chip.warn{background:linear-gradient(135deg,rgba(245,158,11,.22),rgba(245,158,11,.06));
    border-color:rgba(245,158,11,.4);color:#fbbf24}
  .session-chip.danger{background:linear-gradient(135deg,rgba(239,68,68,.25),rgba(239,68,68,.08));
    border-color:rgba(239,68,68,.45);color:#f87171;
    animation:chipPulse 1s ease-in-out infinite}
  @keyframes chipPulse{50%{transform:scale(1.05)}}
  .app-content{max-width:640px;margin:0 auto;padding:0 12px}
  .section-title{display:flex;align-items:center;gap:10px;color:#fff;
    font-size:15px;font-weight:800;letter-spacing:-.1px;margin:6px 4px 14px}
  .section-title::before{content:'';width:3px;height:16px;border-radius:4px;
    background:linear-gradient(180deg,var(--accent-2),var(--accent))}
  .section-title::after{content:'';flex:1;height:1px;
    background:linear-gradient(90deg,rgba(225,29,46,.35),transparent)}
  .cats-grid,.channels-grid,.live-list{display:flex;flex-direction:column;gap:8px}
  .cat-tile,.channel-tile{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--border);border-radius:14px;
    padding:9px 12px;cursor:pointer;transition:transform .15s, border-color .15s;
    display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
  .cat-tile::before,.channel-tile::before{content:'';position:absolute;right:0;
    top:6px;bottom:6px;width:3px;border-radius:4px}
  .cat-tile::before{background:linear-gradient(180deg,var(--accent-2),var(--purple))}
  .cat-tile:active,.channel-tile:active{transform:scale(.98);
    border-color:rgba(225,29,46,.5)}
  .cat-tile .cat-logo,.channel-tile .logo{width:44px;height:44px;border-radius:11px;
    background:rgba(255,255,255,.05);padding:5px;object-fit:contain;flex-shrink:0;
    border:1px solid var(--border);position:relative;z-index:1}
  .cat-tile .cat-info{flex:1;min-width:0;text-align:right;position:relative;z-index:1}
  .cat-tile .cat-name{color:#fff;font-weight:800;font-size:13.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:2px;line-height:1.2}
  .cat-tile .cat-count{color:var(--accent-2);font-size:10.5px;font-weight:700;
    display:inline-flex;align-items:center;gap:4px}
  .cat-tile .cat-arrow{width:22px;height:22px;border-radius:50%;
    background:rgba(255,255,255,.06);display:flex;justify-content:center;
    align-items:center;flex-shrink:0;border:1px solid var(--border)}
  .cat-tile .cat-arrow svg{width:12px;height:12px;fill:var(--text-dim)}
  .channel-tile::before{background:linear-gradient(180deg,var(--green),#4ade80)}
  .channel-tile:not(.live)::before{background:rgba(255,255,255,.15)}
  .channel-tile:not(.live){opacity:.6}
  .channel-tile .name{color:#fff;font-weight:800;font-size:13px;flex:1;
    min-width:0;text-align:right;position:relative;z-index:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .channel-tile .status{display:inline-flex;align-items:center;gap:4px;
    padding:4px 11px;border-radius:100px;font-size:10px;font-weight:800;
    position:relative;z-index:1;flex-shrink:0}
  .channel-tile.live .status{background:linear-gradient(180deg,#4ade80,#16a34a);color:#fff}
  .channel-tile.live .status::before{content:'';width:5px;height:5px;
    border-radius:50%;background:#fff;animation:blink 1.2s infinite}
  .channel-tile:not(.live) .status{background:rgba(255,255,255,.06);
    color:var(--text-dim);border:1px solid var(--border)}
  .live-card{position:relative;display:flex;align-items:center;gap:12px;
    background:linear-gradient(90deg,rgba(225,29,46,.10),rgba(139,92,246,.06) 40%,rgba(255,255,255,.02));
    border:1px solid rgba(225,29,46,.20);border-radius:14px;padding:9px 12px;
    cursor:pointer;overflow:hidden;transition:transform .15s}
  .live-card::before{content:'';position:absolute;right:0;top:6px;bottom:6px;
    width:3px;border-radius:4px;
    background:linear-gradient(180deg,var(--accent-2),var(--purple))}
  .live-card:active{transform:scale(.98);border-color:rgba(225,29,46,.55)}
  .live-card .lc-logo{width:44px;height:44px;border-radius:11px;
    background:rgba(255,255,255,.05);padding:5px;object-fit:contain;flex-shrink:0;
    border:1px solid var(--border);position:relative;z-index:1}
  .live-card .lc-info{flex:1;min-width:0;text-align:right;position:relative;z-index:1}
  .live-card .lc-name{color:#fff;font-weight:800;font-size:13px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
  .live-card .lc-cat{color:var(--text-dim);font-size:10px;font-weight:600;
    display:flex;align-items:center;gap:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live-card .lc-cat svg{width:10px;height:10px;fill:var(--accent-2);flex-shrink:0;opacity:.8}
  .live-card .lc-badge{display:flex;align-items:center;gap:4px;
    padding:4px 10px;border-radius:100px;font-size:10px;font-weight:800;
    flex-shrink:0;position:relative;z-index:1}
  .live-card.on .lc-badge{background:linear-gradient(180deg,#4ade80,#16a34a);color:#fff}
  .live-card.on .lc-badge::before{content:'';width:5px;height:5px;
    border-radius:50%;background:#fff;animation:blink 1.2s infinite}
  .live-card.off .lc-badge{background:rgba(255,255,255,.05);color:var(--text-dim);
    border:1px solid var(--border)}
  .live-card.off{opacity:.55}
  .live-card.off::before{background:rgba(255,255,255,.15)}
  .live-header{display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;margin:0 0 12px;
    background:linear-gradient(135deg,rgba(225,29,46,.18),rgba(139,92,246,.12));
    border:1px solid rgba(225,29,46,.22);border-radius:16px}
  .live-header .lh-icon{width:40px;height:40px;border-radius:12px;
    background:linear-gradient(180deg,var(--accent-2),var(--accent));
    display:flex;justify-content:center;align-items:center;flex-shrink:0}
  .live-header .lh-icon svg{width:20px;height:20px;fill:#fff}
  .live-header .lh-text{flex:1;position:relative;z-index:1;text-align:right;
    padding-inline-end:10px}
  .live-header .lh-title{color:#fff;font-size:14px;font-weight:800}
  .live-header .lh-sub{color:#e8b8be;font-size:10.5px;font-weight:600;margin-top:2px}
  .live-header .lh-count{background:rgba(255,255,255,.12);color:#fff;
    padding:5px 12px;border-radius:100px;font-size:11px;font-weight:800;
    border:1px solid rgba(255,255,255,.15)}
  .empty-msg{text-align:center;color:var(--text-dim);
    padding:50px 20px;font-size:13px;line-height:2;font-weight:500}
  .back-row{margin:0 4px 12px}
  .back-cat-btn{display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.06);color:#fff;padding:8px 16px;
    border-radius:100px;border:1px solid var(--border);
    font-weight:700;font-size:12.5px;cursor:pointer;
    font-family:'Cairo',sans-serif;transition:transform .15s}
  .back-cat-btn:active{background:rgba(225,29,46,.15);
    border-color:rgba(225,29,46,.5);color:var(--accent-2);transform:scale(.96)}
  .app-bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:80;
    background:linear-gradient(180deg,rgba(10,10,15,.9),rgba(10,10,15,.98));
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.06);
    padding:8px 6px calc(8px + var(--safe-bottom));
    display:flex;justify-content:space-around;align-items:center}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 8px;border-radius:14px;cursor:pointer;transition:transform .15s;
    text-decoration:none;color:var(--text-dim);font-size:9.5px;font-weight:700;
    font-family:'Cairo',sans-serif;background:transparent;border:none;
    min-width:0;flex:1;max-width:80px}
  .nav-item svg{width:22px;height:22px;fill:currentColor}
  .nav-item.active{color:var(--accent-2);background:rgba(225,29,46,.1)}
  .nav-item:active{transform:scale(.92)}
  #streamView{display:none;position:fixed;inset:0;background:#000;z-index:100}
  #streamView.show{display:flex;flex-direction:column}
  .stream-player-wrap{flex:1;display:flex;justify-content:center;align-items:center;
    background:#000;overflow:hidden;position:relative}
  .player-box{position:relative;width:100%;height:100%;background:#000;
    display:flex;justify-content:center;align-items:center;overflow:hidden}
  .video-aspect{position:relative;aspect-ratio:16/9;width:100%;
    max-width:calc(100vh * 16 / 9);background:#000;overflow:hidden}
  .video-aspect video{width:100%;height:100%;display:block;object-fit:contain;
    background:#000;pointer-events:none}

    for(let i=0;i<12;i++){
      const s = document.createElement('span');
      s.style.left = Math.random()*100 + '%';
      s.style.animationDuration = (6 + Math.random()*5) + 's';
      s.style.animationDelay = (Math.random()*5) + 's';
      const size = 1.5 + Math.random()*2;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      const colors = ['rgba(225,29,46,.9)','rgba(139,92,246,.9)','rgba(59,130,246,.9)','rgba(255,255,255,.9)'];
      s.style.color = colors[Math.floor(Math.random()*colors.length)];
      s.style.background = s.style.color;
      wrap.appendChild(s);
    }
  })();

  codeInput.addEventListener('input', e=>{
    let v = e.target.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,8);
    if(v.length > 4) v = v.slice(0,4) + '-' + v.slice(4);
    e.target.value = v;
    e.target.classList.remove('err','ok');
    lockMsg.className = 'lock-msg';
    lockMsg.textContent = '';
  });
  codeInput.addEventListener('keypress', e=>{
    if(e.key === 'Enter') submitActivationCode();
  });

  function submitActivationCode(){
    const raw = codeInput.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
    if(raw.length !== 8){
      setLockMsg('⚠️ الكود لازم يكون 8 خانات','err');
      codeInput.classList.add('err');
      setTimeout(()=> codeInput.classList.remove('err'), 700);
      return;
    }
    const code = raw.slice(0,4) + '-' + raw.slice(4);

    if(!mqttConnected){
      setLockMsg('🔌 جاري الاتصال بالسيرفر...','info');
      return;
    }
    setLockBtnLoading(true);
    setLockMsg('🔐 جاري التحقق من الكود...','info');

    setTimeout(()=>{
      if(!codesLoaded){ setTimeout(()=> runCodeCheck(code), 1500); }
      else { runCodeCheck(code); }
    }, 400);
  }

  /* ✅ الدالة الأساسية — بتحترم الوقت الحقيقي وبداية الكود الأولى */
  function runCodeCheck(code){
    const found = activationCodes.find(c =>
      String(c.code||'').toUpperCase() === code && c.active !== false
    );

    if(!found){
      setLockBtnLoading(false);
      setLockMsg('❌ أدخل كود تفعيل صحيح','err');
      codeInput.classList.add('err');
      setTimeout(()=> codeInput.classList.remove('err'), 800);
      return;
    }

    /* المدة بالدقائق (دعم durationMin الجديد و duration القديم) */
    const durationMinutes = Number(found.durationMin)
      || (Number(found.duration) * 60)
      || 1440;
    const durationMs = durationMinutes * 60 * 1000;
    const now = Date.now();

    /* 🕐 لو الكود اتفعّل قبل كده → كمّل من نفس النقطة */
    let startedAt = getCodeStart(code);
    if(!startedAt){
      startedAt = now;
      saveCodeStart(code, startedAt);
    }

    const expiresAt = startedAt + durationMs;
    const remain = expiresAt - now;

    if(remain <= 0){
      /* الكود انتهى فعلاً */
      setLockBtnLoading(false);
      const passedMin = Math.floor((now - startedAt) / 60000);
      setLockMsg('⏰ انتهت مدة هذا الكود (' + passedMin + ' دقيقة مضت) — اطلب كود جديد','err');
      codeInput.classList.add('err');
      setTimeout(()=> codeInput.classList.remove('err'), 1200);
      return;
    }

    /* ✅ لسه فيه وقت — ابدأ جلسة بالوقت المتبقي */
    userSession = {
      code: code,
      startedAt: startedAt,
      expiresAt: expiresAt,
      durationMinutes: durationMinutes
    };
    saveSession(userSession);

    const remainMin = Math.floor(remain / 60000);
    const remainSec = Math.floor((remain % 60000) / 1000);
    const remainTxt = remainMin > 0
      ? remainMin + ' دقيقة و ' + remainSec + ' ثانية'
      : remainSec + ' ثانية';

    codeInput.classList.add('ok');
    setLockMsg('✅ تم التفعيل! باقي ' + remainTxt,'ok');

    setTimeout(()=>{
      setLockBtnLoading(false);
      openApp();
    }, 700);
  }

  function setLockBtnLoading(on){
    if(on){
      activateBtn.disabled = true;
      activateBtn.classList.add('loading');
      activateBtn.innerHTML = '<div class="spinner-mini"></div><span>جاري التحقق...</span>';
    } else {
      activateBtn.disabled = false;
      activateBtn.classList.remove('loading');
      activateBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg><span>تفعيل الكود</span>';
    }
  }

  function setLockMsg(msg, type){
    lockMsg.textContent = msg;
    lockMsg.className = 'lock-msg ' + (type || '');
  }

  function openApp(){
    lockScreen.classList.add('hide');
    setTimeout(()=>{
      lockScreen.style.display = 'none';
      app.classList.add('show');
      bottomNav.style.display = 'flex';
      startExpiryMonitor();
      updateSessionChip();
    }, 500);
  }

  function lockUser(reason){
    if(expiryTimer){ clearInterval(expiryTimer); expiryTimer = null; }
    if(isStreamViewOpen) closeStreamUI();
    stopStream();
    userSession = null;
    clearSession();

    app.classList.remove('show');
    setTimeout(()=> app.style.display = 'none', 300);
    bottomNav.style.display = 'none';
    sessionChip.style.display = 'none';

    lockScreen.style.display = 'flex';
    requestAnimationFrame(()=> lockScreen.classList.remove('hide'));

    codeInput.value = '';
    codeInput.classList.remove('ok','err');
    setLockMsg(reason || '🔒 انتهت صلاحية الكود، أدخل كود جديد','err');
    codeInput.focus();
  }

  function startExpiryMonitor(){
    if(expiryTimer) clearInterval(expiryTimer);
    expiryTimer = setInterval(()=>{
      if(!userSession) return;
      const remain = userSession.expiresAt - Date.now();
      if(remain <= 0){
        lockUser('⏰ انتهت مدة الكود، يرجى إدخال كود جديد');
        return;
      }
      updateSessionChip();
    }, 1000);
  }

  function updateSessionChip(){
    if(!userSession){ sessionChip.style.display = 'none'; return; }
    const remain = Math.max(0, userSession.expiresAt - Date.now());
    const totalSec = Math.floor(remain / 1000);
    const d = Math.floor(totalSec / 86400);
    const h = Math.floor((totalSec % 86400) / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const sec = totalSec % 60;

    let txt;
    if(d > 0){
      txt = d + 'ي ' + h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    } else if(h > 0){
      txt = h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    } else {
      txt = m + ':' + String(sec).padStart(2,'0');
    }
    sessionTime.textContent = txt;

    sessionChip.style.display = 'flex';
    sessionChip.classList.remove('warn','danger');
    if(remain < 5*60*1000) sessionChip.classList.add('danger');
    else if(remain < 30*60*1000) sessionChip.classList.add('warn');
  }

  /* 🔄 استرجاع الجلسة تلقائياً عند فتح الصفحة */
  function tryRestoreSession(){
    const s = loadSession();
    if(!s || !s.expiresAt) return false;
    if(Date.now() >= s.expiresAt){
      clearSession();
      return false;
    }
    userSession = s;
    lockScreen.style.display = 'none';
    app.classList.add('show');
    bottomNav.style.display = 'flex';
    startExpiryMonitor();
    updateSessionChip();
    return true;
  }

  window.addEventListener('load', ()=>{
    setTimeout(()=>{ tryRestoreSession(); }, 200);
  });

  /* ⚠️ مهم جداً: لما المستخدم يرجع للصفحة، شيك فوراً لو انتهت */
  document.addEventListener('visibilitychange', ()=>{
    if(!userSession) return;
    if(!document.hidden){
      if(Date.now() >= userSession.expiresAt){
        lockUser('⏰ انتهت مدة الكود، يرجى إدخال كود جديد');
      } else {
        updateSessionChip();
      }
    }
  });
  window.addEventListener('pageshow', ()=>{
    if(userSession && Date.now() >= userSession.expiresAt){
      lockUser('⏰ انتهت مدة الكود، يرجى إدخال كود جديد');
    }
  });

  const client = mqtt.connect(BROKER, { clientId: MY_ID });

  client.on('connect', ()=>{
    mqttConnected = true;
    lockSub.classList.remove('offline'); lockSub.classList.add('online');
    lockSubText.textContent = 'متصل - جاهز للتفعيل';

    client.subscribe(TOPIC_CMD);
    client.subscribe(TOPIC_DATA);
    client.subscribe(TOPIC_CODES);
    client.publish(TOPIC_HB, JSON.stringify({id:MY_ID}));
    setInterval(()=> client.publish(TOPIC_HB, JSON.stringify({id:MY_ID})), 5000);

    setTimeout(()=>{ if(!codesLoaded) codesLoaded = true; }, 3000);
  });

  client.on('offline', ()=>{
    mqttConnected = false;
    lockSub.classList.remove('online'); lockSub.classList.add('offline');
    lockSubText.textContent = 'غير متصل - جاري إعادة الاتصال...';
  });
  client.on('reconnect', ()=>{
    lockSub.classList.remove('online'); lockSub.classList.add('offline');
    lockSubText.textContent = 'جاري إعادة الاتصال...';
  });
  client.on('error', ()=>{
    mqttConnected = false;
    lockSub.classList.remove('online'); lockSub.classList.add('offline');
    lockSubText.textContent = 'فشل الاتصال بالسيرفر';
  });

  client.on('message', (topic, msg)=>{
    try{
      const data = JSON.parse(msg.toString());

      if(topic === TOPIC_CODES){
        activationCodes = Array.isArray(data) ? data : [];
        codesLoaded = true;
        if(userSession){
          const stillValid = activationCodes.some(c =>
            String(c.code||'').toUpperCase() === userSession.code && c.active !== false
          );
          if(!stillValid){ lockUser('❌ تم إلغاء الكود من قِبل الإدارة'); }
        }
        return;
      }

      if(topic === TOPIC_DATA){
        categoriesData = Array.isArray(data) ? data : [];
        renderCurrentView();
      }

      if(topic === TOPIC_CMD){
        if(data.action === 'stopAll'){ if(isStreamViewOpen) closeStreamUI(); return; }
        if(data.action === 'kickAll'){ lockUser('🚫 تم إنهاء جلستك من قِبل الإدارة'); return; }
        if(data.action === 'play' && data.token){
          if (!client.options.reconnectPeriod || Date.now() - (data.ts || 0) < 60000) {
            currentChannelId = data.channelId;
            if(!isStreamViewOpen) {
              streamView.classList.add('show');
              document.body.style.overflow = 'hidden';
              isStreamViewOpen = true;
              history.pushState({stream: true}, '');
              autoRotateAndFS();
            }
            playStream(tokenToUrl(data.token));
          }
        } else if(data.action === 'stop'){
          if(currentChannelId === data.channelId) closeStreamUI();
        }
      }
    }catch(e){}
  });

  function renderCurrentView(){
    if(currentCatIndex === -1) renderCategories();
    else renderChannels(currentCatIndex);
  }

  function renderCategories(){
    if(!categoriesData.length){
      catsGrid.innerHTML = '<div class="empty-msg">📺<br>لا توجد أقسام متاحة حالياً<br>تابع قناتنا على تيليجرام ليصلك كل جديد</div>';
      return;
    }
    catsGrid.innerHTML = categoriesData.map((cat,i)=>{
      const count = (cat.channels || []).length;
      const liveCountVal = (cat.channels || []).filter(c => c.live).length;
      const countText = liveCountVal > 0 ? `${liveCountVal} بث حي` : `${count} قناة`;
      return `
        <div class="cat-tile" onclick="openCategory(${i})">
          <img class="cat-logo" src="${cat.logo||''}" onerror="this.style.opacity=.15" alt="" loading="lazy">
          <div class="cat-info">
            <div class="cat-name">${escapeHtml(cat.name||'قسم')}</div>
            <div class="cat-count">${countText}</div>
          </div>
          <div class="cat-arrow"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div>
        </div>`;
    }).join('');
  }

  function renderChannels(ci){
    const cat = categoriesData[ci];
    if(!cat){ backToCategories(); return; }
    catTitle.textContent = cat.name || 'قنوات القسم';
    const list = cat.channels || [];
    if(!list.length){
      channelsGrid.innerHTML = '<div class="empty-msg">لا توجد قنوات في هذا القسم حالياً</div>';
      return;
    }
    channelsGrid.innerHTML = list.map((ch,chi)=>`
      <div class="channel-tile ${ch.live?'live':''}" onclick="openChannel(${chi})">
        <img class="logo" src="${ch.logo||''}" onerror="this.style.opacity=.15" alt="" loading="lazy">
        <div class="name">${escapeHtml(ch.name||'قناة')}</div>
        <span class="status">${ch.live?'مباشر':'غير متاح'}</span>
      </div>`).join('');
  }

  function renderLiveView(){
    const allChannels = [];
    categoriesData.forEach((cat, ci) => {
      (cat.channels || []).forEach((ch, chi) => {
        allChannels.push({ch, catName: cat.name, ci, chi});
      });
    });
    allChannels.sort((a,b) => (b.ch.live?1:0) - (a.ch.live?1:0));
    liveCount.textContent = allChannels.length;
    if(!allChannels.length){
      liveList.innerHTML = '<div class="empty-msg">📺<br>لا توجد قنوات متاحة حالياً</div>';
      return;
    }
    liveList.innerHTML = allChannels.map(item => `
      <div class="live-card ${item.ch.live?'on':'off'}" onclick="openLiveChannel(${item.ci},${item.chi})">
        <img class="lc-logo" src="${item.ch.logo||''}" onerror="this.style.opacity=.15" alt="" loading="lazy">
        <div class="lc-info">
          <div class="lc-name">${escapeHtml(item.ch.name||'قناة')}</div>
          <div class="lc-cat">
            <svg viewBox="0 0 24 24"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-1.29 1.41L10.59 6H3c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 13H3V8h18v11zM9 10v6l5-3-5-3z"/></svg>
            ${escapeHtml(item.catName||'قسم')}
          </div>
        </div>
        <span class="lc-badge">${item.ch.live?'مباشر':'غير متاح'}</span>
      </div>`).join('');
  }

  function openLiveChannel(ci, chi){
    const cat = categoriesData[ci];
    if(!cat) return;
    playChannelObject(cat.channels[chi]);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function openCategory(i){
    currentCatIndex = i;
    viewCategories.style.display = 'none';
    viewChannels.style.display = 'block';
    viewLive.style.display = 'none';
    renderChannels(i);
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function backToCategories(){
    currentCatIndex = -1;
    viewCategories.style.display = 'block';
    viewChannels.style.display = 'none';
    viewLive.style.display = 'none';
    renderCategories();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function openChannel(chi){
    const cat = categoriesData[currentCatIndex];
    if(!cat) return;
    playChannelObject(cat.channels[chi]);
  }

  function playChannelObject(ch){
    if(!ch) return;
    if(!ch.live){ showToast('القناة غير متاحة حالياً'); return; }
    if(!ch.token){ showToast('لا يوجد توكن للبث'); return; }
    currentChannelId = ch.id;
    isStreamViewOpen = true;
    streamView.classList.add('show');
    document.body.style.overflow = 'hidden';
    playStream(tokenToUrl(ch.token));
    history.pushState({stream: true}, '');
    autoRotateAndFS();
  }

  function autoRotateAndFS(){
    if(isDesktopMode){
      playerBox.classList.add('desktop-mode');
      playerBox.classList.remove('rotate-css');
      enterFullscreen();
      return;
    }
    playerBox.classList.add('rotate-css');
    enterFullscreen();
    setTimeout(()=>{
      try {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
      } catch(e){}
    }, 200);
  }

  function enterFullscreen(){
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      if (playerBox.requestFullscreen) playerBox.requestFullscreen().catch(()=>{});
      else if (playerBox.webkitRequestFullscreen) playerBox.webkitRequestFullscreen();
    } catch(e){}
  }

  function exitFsSafe(){
    playerBox.classList.remove('rotate-css');
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    } catch(e){}
    try {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch(e){}
  }

  function toggleDesktopMode(){
    isDesktopMode = !isDesktopMode;
    if(isDesktopMode){
      playerBox.classList.add('desktop-mode');
      playerBox.classList.remove('rotate-css');
      modeBtn.classList.add('active');
      modeText.textContent = 'وضع الهاتف';
      modeIcon.innerHTML = '<path d="'+ICON_PHONE+'"/>';
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
      enterFullscreen();
      resetHideTimer();
      showToast('تم تفعيل وضع الشاشات 🖥️');
    } else {
      playerBox.classList.remove('desktop-mode');
      modeBtn.classList.remove('active');
      modeText.textContent = 'وضع للشاشات';
      modeIcon.innerHTML = '<path d="'+ICON_DESKTOP+'"/>';
      showToast('تم إلغاء الوضع');
      if(isStreamViewOpen){
        playerBox.classList.add('rotate-css');
        try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); } catch(e){}
        enterFullscreen();
      }
      resetHideTimer();
    }
  }

  window.addEventListener('popstate', function() {
    if (isStreamViewOpen) closeStreamUI();
  });

  function closeStream(){
    if (isStreamViewOpen) {
      isStreamViewOpen = false;
      closeStreamUI();
      if (history.state && history.state.stream) history.back();
    }
  }

  function closeStreamUI(){
    isStreamViewOpen = false;
    currentChannelId = null;
    streamView.classList.remove('show');
    document.body.style.overflow = '';
    stopStream();
    exitFsSafe();
  }

  function playStream(url){
    if(!url){ stopStream(); return; }
    showLoader();
    if(hls){ hls.stopLoad(); hls.detachMedia(); hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();
    setTimeout(() => {
      if(Hls.isSupported()){
        hls = new Hls({lowLatencyMode:true,enableWorker:true,maxBufferLength:30,maxMaxBufferLength:60,liveSyncDurationCount:3,liveMaxLatencyDurationCount:10,manifestLoadingTimeOut:15000,manifestLoadingMaxRetry:5,fragLoadingTimeOut:20000,fragLoadingMaxRetry:6});
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, ()=> video.play().catch(()=>{}));
        hls.on(Hls.Events.ERROR, (e,d)=>{
          if(d.fatal){
            if(d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if(d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          }
        });
      } else if(video.canPlayType('application/vnd.apple.mpegurl')){
        video.src = url; video.play().catch(()=>{});
      }
    }, 100);
  }

  let loaderTimeout = null;
  function showLoader(){
    streamLoader.classList.remove('hidden');
    if(loaderTimeout) clearTimeout(loaderTimeout);
    loaderTimeout = setTimeout(()=>{ hideLoader(); }, 20000);
  }
  function hideLoader(){
    streamLoader.classList.add('hidden');
    if(loaderTimeout){ clearTimeout(loaderTimeout); loaderTimeout = null; }
  }

  video.addEventListener('playing', ()=>{ hideLoader(); });
  video.addEventListener('play', ()=>{ hideLoader(); });
  video.addEventListener('waiting', ()=>{ showLoader(); });
  video.addEventListener('stalled', ()=>{ showLoader(); });

  function stopStream(){
    if(hls){ hls.stopLoad(); hls.detachMedia(); hls.destroy(); hls = null; }
    video.pause(); video.removeAttribute('src'); video.load();
    hideLoader();
  }

  function togglePlay(){ video.paused ? video.play().catch(()=>{}) : video.pause(); }
  video.addEventListener('play', ()=>{ playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'; });
  video.addEventListener('pause', ()=>{ playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; });

  function toggleMute(){
    video.muted = !video.muted;
    volIcon.innerHTML = video.muted
      ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
      : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
  }

  video.addEventListener('timeupdate', ()=>{
    if(video.duration && isFinite(video.duration) && video.duration > 0){
      progressFill.style.width = ((video.currentTime/video.duration)*100) + '%';
      timeDisplay.innerHTML = fmt(video.currentTime)+' / '+fmt(video.duration);
    } else {
      progressFill.style.width = '100%';
      timeDisplay.innerHTML = '<span class="live-dot"></span>';
    }
  });

  function fmt(s){
    if(!s || isNaN(s) || !isFinite(s)) return '0:00';
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return h > 0 ? h+':'+m.toString().padStart(2,'0')+':'+sec : m+':'+sec;
  }

  const progressWrap = $('progressWrap');
  let isDraggingSeek = false;
  function seekVideo(e) {
    if (!video.duration || !isFinite(video.duration)) return;
    const rect = progressWrap.getBoundingClientRect();
    let percent = (e.clientX - rect.left) / rect.width;
    percent = Math.max(0, Math.min(1, percent));
    video.currentTime = percent * video.duration;
    progressFill.style.width = (percent * 100) + '%';
  }
  progressWrap.addEventListener('pointerdown', (e) => {
    isDraggingSeek = true;
    try { progressWrap.setPointerCapture(e.pointerId); } catch(err){}
    seekVideo(e); e.preventDefault();
  });
  progressWrap.addEventListener('pointermove', (e) => {
    if (isDraggingSeek) { seekVideo(e); e.preventDefault(); }
  });
  progressWrap.addEventListener('pointerup', (e) => {
    isDraggingSeek = false;
    try { progressWrap.releasePointerCapture(e.pointerId); } catch(err){}
  });
  progressWrap.addEventListener('pointercancel', () => { isDraggingSeek = false; });

  let controlsVisible = true, hideTimer = null;
  function showControls(){ customControls.classList.remove('hidden'); controlsVisible = true; resetHideTimer(); }
  function hideControls(){ customControls.classList.add('hidden'); controlsVisible = false; if(hideTimer){clearTimeout(hideTimer);hideTimer=null;} }
  function resetHideTimer(){
    if(hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>{ hideControls(); }, 3500);
  }
  resetHideTimer();

  playerBox.addEventListener('click', (e) => {
    if (customControls.contains(e.target)) { resetHideTimer(); return; }
    if (e.target.closest('.back-btn') || e.target.closest('.mode-btn')) return;
    if (isDraggingSeek) return;
    controlsVisible ? hideControls() : showControls();
  });
  playerBox.addEventListener('touchstart', (e) => {
    if (customControls.contains(e.target)) { resetHideTimer(); return; }
    if (e.target.closest('.back-btn') || e.target.closest('.mode-btn')) return;
    if (isDraggingSeek) return;
    controlsVisible ? hideControls() : showControls();
  }, {passive:true});

  function navHome(){
    currentCatIndex = -1;
    viewCategories.style.display = 'block';
    viewChannels.style.display = 'none';
    viewLive.style.display = 'none';
    renderCategories();
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.querySelectorAll('.nav-item')[0].classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function navLive(){
    currentCatIndex = -1;
    viewCategories.style.display = 'none';
    viewChannels.style.display = 'none';
    viewLive.style.display = 'block';
    renderLiveView();
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.querySelectorAll('.nav-item')[1].classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }
</script>
</body>
</html>
